<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>🌿 BloomBuddy - Progress</title>
</head>
<body class="dashboard-body">
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="header-top">
        <a href="dashboard.html" style="color: var(--primary-color); font-size: 1.5rem; text-decoration: none;">←</a>
        <h1>Progress</h1>
        <div style="width: 24px;"></div>
      </div>
    </header>

    <main class="dashboard-main">
      <!-- Plant Journey -->
      <section>
        <h3>Plant Journey 🌱</h3>
        <div class="growth-stage">
          <div class="stage-item">
            <div class="stage-emoji">🌱</div>
            <p>Seed</p>
          </div>
          <div class="stage-item">
            <div class="stage-emoji">🌿</div>
            <p>Sprout</p>
          </div>
          <div class="stage-item active" id="currentStage">
            <div class="stage-emoji">🌸</div>
            <p>Bloom</p>
          </div>
        </div>
      </section>

      <!-- Stats -->
      <section>
        <h3>Your Stats 📊</h3>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-number" id="totalCompleted">0</div>
            <div class="stat-label">Goals Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="completionRate">0%</div>
            <div class="stat-label">Completion Rate</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="longestStreak">0</div>
            <div class="stat-label">Longest Streak</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="weekConsistency">0%</div>
            <div class="stat-label">Week Consistency</div>
          </div>
        </div>
      </section>

      <!-- Mood Trends -->
      <section>
        <h3>Mood Trends 📈</h3>
        <div id="moodTrends">
          <p style="color: var(--text-secondary); text-align: center;">Loading mood data...</p>
        </div>
      </section>

      <!-- Insights -->
      <section>
        <h3>Your Insights 🧠</h3>
        <div id="insights">
          <p id="insight1" style="color: var(--text-secondary); margin-bottom: 12px;"></p>
          <p id="insight2" style="color: var(--text-secondary); margin-bottom: 12px;"></p>
          <p id="insight3" style="color: var(--text-secondary);"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    function initProgress() {
      let user = DataManager.getUser();
      if (!user) return;

      // Update plant stage indicator
      const stageIndex = { 'seed': 0, 'sprout': 1, 'bloom': 2 };
      const current = stageIndex[user.plant.stage] || 0;
      const stages = document.querySelectorAll('.stage-item');
      stages.forEach((stage, i) => {
        stage.classList.remove('active');
        if (i === current) stage.classList.add('active');
      });

      // Calculate stats
      const totalCompleted = user.goals.filter(g => g.completed).length;
      const totalGoals = user.goals.length;
      const completionRate = totalGoals > 0 ? Math.round((totalCompleted / totalGoals) * 100) : 0;

      document.getElementById('totalCompleted').textContent = totalCompleted;
      document.getElementById('completionRate').textContent = completionRate + '%';
      document.getElementById('longestStreak').textContent = user.streak.longest;

      // Week consistency (rough calculation)
      const weekConsistency = Math.min(Math.round((user.streak.current / 7) * 100), 100);
      document.getElementById('weekConsistency').textContent = weekConsistency + '%';

      // Mood trends
      const moodCounts = {};
      user.moods.forEach(mood => {
        moodCounts[mood.mood] = (moodCounts[mood.mood] || 0) + 1;
      });

      let moodHtml = '';
      if (Object.keys(moodCounts).length === 0) {
        moodHtml = '<p style="color: var(--text-secondary); text-align: center;">No mood data yet. Log your mood daily!</p>';
      } else {
        Object.entries(moodCounts).forEach(([mood, count]) => {
          moodHtml += `<p style="margin-bottom: 8px;"><strong>${mood}</strong> — logged ${count} time${count > 1 ? 's' : ''}</p>`;
        });
      }
      document.getElementById('moodTrends').innerHTML = moodHtml;

      // Generate insights
      const insights = generateInsights(user, moodCounts, completionRate);
      document.getElementById('insight1').textContent = insights[0];
      document.getElementById('insight2').textContent = insights[1];
      document.getElementById('insight3').textContent = insights[2];
    }

    function generateInsights(user, moodCounts, completionRate) {
      const insights = [];

      if (completionRate > 80) {
        insights.push('✨ You\'re crushing it! Your consistency is amazing.');
      } else if (completionRate > 50) {
        insights.push('📈 You\'re making great progress! Keep it up.');
      } else {
        insights.push('🌱 Every small step counts. Be patient with yourself.');
      }

      // Mood insight
      if (Object.keys(moodCounts).length > 0) {
        const mostFrequentMood = Object.entries(moodCounts).sort((a, b) => b[1] - a[1])[0];
        insights.push(`💬 You felt ${mostFrequentMood[0]} most frequently this week.`);
      } else {
        insights.push('💬 Log your mood daily to see trends and insights.');
      }

      // Streak insight
      if (user.streak.current >= 7) {
        insights.push(`🔥 You have a ${user.streak.current}-day streak! You\'re on fire!`);
      } else if (user.streak.current >= 3) {
        insights.push(`🔥 Keep your ${user.streak.current}-day streak alive!`);
      } else {
        insights.push('💪 Start a streak today! Even 1 day is a win.');
      }

      return insights;
    }

    window.addEventListener('load', initProgress);
  </script>
  <style>
    .growth-stage {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .stage-item {
      text-align: center;
      padding: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      transition: all 0.3s;
    }

    .stage-item.active {
      border-color: var(--primary-color);
      background-color: rgba(46, 139, 87, 0.1);
    }

    .stage-emoji {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 8px;
    }

    .stage-item p {
      margin: 0;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .stat-card {
      padding: 16px;
      background-color: rgba(46, 139, 87, 0.1);
      border-radius: 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
  </style>
</body>
</html>
