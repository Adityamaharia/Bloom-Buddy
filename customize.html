<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Customize your BloomBuddy plant, pot, and app theme.">
    <link rel="stylesheet" href="style.css">
    <title>🌿 BloomBuddy - Customize</title>
</head>
<body class="dashboard-body">
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="header-top">
        <a href="dashboard.html" aria-label="Back to dashboard" style="color: var(--primary-color); font-size: 1.5rem; text-decoration: none; margin-right: 12px;">←</a>
        <h1 style="flex-grow: 1; text-align: left;">Customize</h1>
        <button class="menu-btn" aria-label="Menu" onclick="toggleMenu()">☰</button>
      </div>
      <nav class="header-nav" id="headerMenu">
        <a href="dashboard.html">Home</a>
        <a href="progress.html">Progress</a>
        <a href="health-tips.html">Tips</a>
        <a href="customize.html" class="active">Customize</a>
        <a href="settings.html">Settings</a>
      </nav>
    </header>

    <main class="dashboard-main">
      <!-- Plant Selection -->
      <section>
        <h3>Choose Your Plant 🌱</h3>
        <div class="custom-grid">
          <div class="custom-option selected" onclick="changePlant(event, 'basic', '🌿')">
            <div style="font-size: 3rem;">🌿</div>
            <p>Basic Plant</p>
          </div>
          <div class="custom-option" onclick="changePlant(event, 'flower', '🌸')">
            <div style="font-size: 3rem;">🌸</div>
            <p>Flower</p>
          </div>
          <div class="custom-option" onclick="changePlant(event, 'cactus', '🌵')">
            <div style="font-size: 3rem;">🌵</div>
            <p>Cactus</p>
          </div>
          <div class="custom-option" onclick="changePlant(event, 'tree', '🌳')">
            <div style="font-size: 3rem;">🌳</div>
            <p>Tree</p>
          </div>
          <div class="custom-option" onclick="changePlant(event, 'sunflower', '🌻')">
            <div style="font-size: 3rem;">🌻</div>
            <p>Sunflower</p>
          </div>
          <div class="custom-option" onclick="changePlant(event, 'rose', '🌹')">
            <div style="font-size: 3rem;">🌹</div>
            <p>Rose</p>
          </div>
        </div>
      </section>

      <!-- Pot Selection -->
      <section>
        <h3>Choose Your Pot 🪴</h3>
        <div class="custom-grid">
          <div class="custom-option selected" onclick="changePot(event, 'classic', '🪴')">
            <div style="font-size: 3rem;">🪴</div>
            <p>Classic</p>
          </div>
          <div class="custom-option" onclick="changePot(event, 'gold', '✨')">
            <div style="font-size: 3rem;">✨</div>
            <p>Golden</p>
          </div>
          <div class="custom-option" onclick="changePot(event, 'wood', '🪵')">
            <div style="font-size: 3rem;">🪵</div>
            <p>Wooden</p>
          </div>
          <div class="custom-option" onclick="changePot(event, 'ceramic', '🏺')">
            <div style="font-size: 3rem;">🏺</div>
            <p>Ceramic</p>
          </div>
        </div>
      </section>

      <!-- Background Theme -->
      <section>
        <h3>Background Theme 🌅</h3>
        <div class="custom-grid">
          <div class="custom-option selected" onclick="changeTheme(event, 'day')">
            <div style="font-size: 3rem;">🌅</div>
            <p>Day</p>
          </div>
          <div class="custom-option" onclick="changeTheme(event, 'night')">
            <div style="font-size: 3rem;">🌙</div>
            <p>Night</p>
          </div>
          <div class="custom-option" onclick="changeTheme(event, 'rain')">
            <div style="font-size: 3rem;">🌧️</div>
            <p>Rain</p>
          </div>
          <div class="custom-option" onclick="changeTheme(event, 'sunset')">
            <div style="font-size: 3rem;">🌅</div>
            <p>Sunset</p>
          </div>
        </div>
      </section>

      <!-- Preview -->
      <section style="text-align: center; background: linear-gradient(135deg, rgba(46, 139, 87, 0.05) 0%, rgba(46, 139, 87, 0.1) 100%);">
        <h3>Preview</h3>
        <div class="preview-combo">
          <div class="preview-plant-emoji" id="previewPlant" aria-hidden="true">🌿</div>
          <div class="preview-pot-emoji" id="previewPotEmoji" aria-hidden="true">🪴</div>
        </div>
      </section>

      <button class="btn-primary" onclick="saveCustomization()">Save Changes</button>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    let tempPlant = { type: '', emoji: '' };
    let tempPot = { type: '', emoji: '' };
    let tempTheme = '';

    function toggleMenu() {
      document.getElementById('headerMenu').classList.toggle('active');
    }

    function changePlant(e, type, emoji) {
      tempPlant = { type, emoji };
      document.querySelectorAll('section:first-child .custom-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      e.target.closest('.custom-option').classList.add('selected');
      document.getElementById('previewPlant').textContent = emoji;
    }

    function changePot(e, type, emoji) {
      tempPot = { type, emoji };
      document.querySelectorAll('section:nth-child(2) .custom-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      e.target.closest('.custom-option').classList.add('selected');
      document.getElementById('previewPotEmoji').textContent = emoji;
    }

    function changeTheme(e, theme) {
      tempTheme = theme;
      document.querySelectorAll('section:nth-child(3) .custom-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      e.target.closest('.custom-option').classList.add('selected');
    }

    function saveCustomization() {
      let user = DataManager.getUser();
      if (user) {
        if (tempPlant.type) {
          user.plant.type = tempPlant.type;
          user.plant.emoji = tempPlant.emoji;
        }
        if (tempPot.type) {
          user.plant.pot = tempPot.type;
          user.plant.potEmoji = tempPot.emoji;
        }
        if (tempTheme) {
          user.preferences.theme = tempTheme;
        }
        DataManager.saveUser(user);
        showToast('Customization saved! ✨');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }
    }

    window.addEventListener('load', () => {
      let user = DataManager.getUser();
      if (user) {
        DataManager.applyTheme();
        document.getElementById('previewPlant').textContent = user.plant.emoji;
        if (user.plant.potEmoji) {
            document.getElementById('previewPotEmoji').textContent = user.plant.potEmoji;
        }
        tempPlant = { type: user.plant.type, emoji: user.plant.emoji };
        tempPot = { type: user.plant.pot, emoji: user.plant.potEmoji };
      }

      // Accessibility for options
      document.querySelectorAll('.custom-option').forEach(el => {
        el.setAttribute('tabindex', '0');
        el.setAttribute('role', 'button');
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter') el.click();
        });
      });
    });
  </script>
  <style>
    .custom-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .custom-option {
      padding: 20px;
      border: 2px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      background-color: white;
    }

    .custom-option:hover {
      border-color: var(--primary-color);
      background-color: rgba(46, 139, 87, 0.05);
    }

    .custom-option.selected {
      border-color: var(--primary-color);
      background-color: rgba(46, 139, 87, 0.1);
    }

    .custom-option p {
      margin: 12px 0 0 0;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .preview-combo {
      position: relative;
      height: 120px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    
    .preview-plant-emoji {
      font-size: 4rem;
      position: absolute;
      bottom: 20px;
      z-index: 1;
    }
    
    .preview-pot-emoji {
      font-size: 4rem;
      position: absolute;
      bottom: -10px;
      z-index: 2;
    }

    @media (max-width: 480px) {
      .custom-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</body>
</html>
